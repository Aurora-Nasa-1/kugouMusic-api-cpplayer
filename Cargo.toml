[package]
name = "kugou-music-rs"
version = "0.1.0"
edition = "2021"
description = "Kugou Music Provider for CPPlayer-KMP (Standard v3 API)"
license = "MIT"

[lib]
name = "kugou_music_rs"
crate-type = ["cdylib", "rlib"]

[features]
default = []
jni = ["dep:jni"]
jni-android = ["jni", "dep:android_logger"]
legacy-jni-symbols = []

[dependencies]
tiny_http = "0.12"
ureq = { version = "2", default-features = false, features = ["tls", "gzip", "json"] }
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
aes = "0.8"
rsa = { version = "0.9", features = ["pem", "sha2", "std"] }
num-traits = "0.2"
base64 = "0.22"
flate2 = "1"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
libc = "0.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
webpki-roots = "0.26"
qrcode = { version = "0.14.0", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
jni = { version = "0.21", optional = true }
android_logger = { version = "0.14", optional = true }

[patch.crates-io]
tiny_http = { path = "vendor/tiny_http" }

[profile.release]
opt-level = 3
lto = true
panic = "abort"
